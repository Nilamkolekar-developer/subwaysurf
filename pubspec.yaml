name: subway_surf_demo
description: A 3-lane endless runner, Subway Surfers style.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flame: ^1.18.0
  shared_preferences: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/redcap_sheet.png
    - assets/images/train_front_yellow.png
    - assets/images/train_front_red.png
    - assets/images/train_front_blue.png
    - assets/images/train_front_green.png
    - assets/images/train_front_orange.png
    - assets/images/barrier_low.png
    - assets/images/barrier_overhead.png